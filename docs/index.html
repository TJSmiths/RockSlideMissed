<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RockSlideMissed</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23e44%22/%3E%3Crect x=%221%22 y=%227%22 width=%2214%22 height=%222%22 fill=%22%23222%22/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
  <header class="titlebar">
    <h1>RockSlideMissed</h1>
    <div class="spacer"></div>
    <select id="format" aria-label="format" title="VGC and singles keep separate teams and data">
      <option value="vgc">VGC (doubles)</option>
      <option value="singles">Singles (BSS)</option>
    </select>
    <div class="viewctl" role="group" aria-label="display">
      <button id="text-smaller" title="smaller text" aria-label="smaller text">A−</button>
      <button id="text-larger" title="larger text" aria-label="larger text">A+</button>
      <select id="theme" aria-label="theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="contrast">High contrast</option>
      </select>
    </div>
  </header>
  <aside class="sidebar">
    <nav aria-label="pages">
      <button class="navbtn" data-page="build" aria-current="page"><span class="ico" aria-hidden="true">✎</span>Build</button>
      <button class="navbtn" data-page="teams"><span class="ico" aria-hidden="true">☰</span>Teams</button>
    </nav>
  </aside>
  <div class="content">
  <main>
    <section class="page" id="page-build">
      <div class="panel" id="build-panel"><h2>Build</h2><p class="dim">Loading the usage data...</p></div>
    </section>
    <section class="page" id="page-teams" hidden>
      <div class="panel" id="teams-panel"><h2>Teams</h2></div>
    </section>
  </main>
  </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
